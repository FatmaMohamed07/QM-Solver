<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quine-McCluskey Advanced Solver, K-Map & Verification</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #fff;
            --text-color: #333;
            --label-color: #34495e;
            --input-bg: #fff;
            --input-border: #bdc3c7;
            --output-bg: #ecf0f1;
            --step-bg: #fff;
            --table-border: #bdc3c7;
            --th-bg: #2c3e50;
            --th-color: #fff;
            --selected-bg: #d4edda;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --label-color: #b0bec5;
            --input-bg: #2d2d2d;
            --input-border: #444;
            --output-bg: #252525;
            --step-bg: #2a2a2a;
            --table-border: #444;
            --th-bg: #37474f;
            --th-color: #fff;
            --selected-bg: #1b3b22;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        .theme-toggle {
            position: absolute;
            top: 30px;
            left: 30px;
            background: none;
            border: 1px solid var(--input-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: auto;
        }
        h1 {
            color: var(--text-color);
            text-align: center;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: var(--label-color);
        }
        input[type="text"], input[type="number"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--input-border);
            background-color: var(--input-bg);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 10px;
        }
        button {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #219653;
        }
        .btn-print {
            background-color: #2980b9;
        }
        .btn-print:hover {
            background-color: #1f618d;
        }
        .btn-copy {
            background-color: #8e44ad;
            margin-top: 10px;
            width: auto;
            padding: 8px 15px;
            font-size: 14px;
        }
        .btn-copy:hover {
            background-color: #6c3483;
        }
        #output {
            margin-top: 30px;
            padding: 20px;
            background: var(--output-bg);
            border-radius: 6px;
            min-height: 150px;
        }
        .table-step {
            margin-bottom: 25px;
            background: var(--step-bg);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--table-border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--table-border);
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: var(--text-color);
        }
        th {
            background-color: var(--th-bg);
            color: var(--th-color);
        }
        .mark-x {
            color: #e74c3c;
            font-weight: bold;
            font-size: 18px;
        }
        .kmap-cell-1 {
            background-color: rgba(39, 174, 96, 0.25);
            color: #27ae60;
            font-weight: bold;
            font-size: 16px;
            border: 2px dashed #27ae60;
        }
        .kmap-cell-d {
            background-color: rgba(230, 126, 34, 0.2);
            color: #e67e22;
            font-weight: bold;
            font-size: 16px;
        }
        .group-card {
            background: rgba(41, 128, 185, 0.1);
            border-left: 4px solid #2980b9;
            padding: 10px 15px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 14px;
        }
        .final-result {
            background: var(--step-bg);
            border: 2px solid #27ae60;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
        .verification-badge-match {
            background-color: #d4edda;
            color: #155724;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        @media print {
            body {
                background-color: #ffffff !important;
                color: #000000 !important;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                background: #ffffff !important;
                max-width: 100% !important;
            }
            button, .input-group, h1, .theme-toggle {
                display: none !important;
            }
            #output {
                background: #ffffff !important;
                margin-top: 0;
                padding: 0;
                color: #000000 !important;
            }
            .table-step, .final-result {
                background: #ffffff !important;
                border: 1px solid #ccc !important;
                page-break-inside: avoid;
            }
            th {
                background-color: #333333 !important;
                color: #ffffff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            td {
                color: #000000 !important;
            }
            .kmap-cell-1 {
                background-color: #e2f0d9 !important;
                border: 2px dashed #27ae60 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .verification-badge-match {
                background-color: #e2f0d9 !important;
                color: #155724 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body data-theme="light">

    <div class="container">
        <button class="theme-toggle" onclick="toggleTheme()">🌙 Dark Mode</button>
        <h1>Quine-McCluskey Advanced Solver & K-Map</h1>
        
        <div class="input-group">
            <label for="type">Form Type:</label>
            <select id="type">
                <option value="SOP">SoP (Sum of Products - Minterms)</option>
                <option value="POS">PoS (Product of Sums - Maxterms)</option>
            </select>
        </div>

        <div class="input-group">
            <label for="variables">Number of Variables (1 - 10):</label>
            <input type="number" id="variables" min="1" max="10" value="4" placeholder="Enter number of variables (e.g., 4)">
        </div>

        <div class="input-group">
            <label for="terms">Primary Terms (Minterms / Maxterms) - comma or space separated:</label>
            <input type="text" id="terms" placeholder="e.g., 1, 2, 3, 5, 6">
        </div>

        <div class="input-group">
            <label for="dontcares">Don't Cares (Optional) - comma or space separated:</label>
            <input type="text" id="dontcares" placeholder="e.g., 0, 7">
        </div>

        <div class="btn-container">
            <button onclick="startAdvancedSolver()">Run Tabular Method & K-Map</button>
            <button class="btn-print" onclick="window.print()">Print Report / PDF</button>
        </div>

        <div id="output">
            <h3>Results and steps will appear here...</h3>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (localStorage.getItem('theme') === 'dark') {
                document.body.setAttribute('data-theme', 'dark');
                document.querySelector('.theme-toggle').innerText = '☀️ Light Mode';
            }
            if(localStorage.getItem('qmc_type')) document.getElementById('type').value = localStorage.getItem('qmc_type');
            if(localStorage.getItem('qmc_vars')) document.getElementById('variables').value = localStorage.getItem('qmc_vars');
            if(localStorage.getItem('qmc_terms')) document.getElementById('terms').value = localStorage.getItem('qmc_terms');
            if(localStorage.getItem('qmc_dc')) document.getElementById('dontcares').value = localStorage.getItem('qmc_dc');
        }

        function toggleTheme() {
            if (document.body.getAttribute('data-theme') === 'dark') {
                document.body.setAttribute('data-theme', 'light');
                document.querySelector('.theme-toggle').innerText = '🌙 Dark Mode';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.setAttribute('data-theme', 'dark');
                document.querySelector('.theme-toggle').innerText = '☀️ Light Mode';
                localStorage.setItem('theme', 'dark');
            }
        }

        function saveInputsToStorage(formType, varCount, terms, dc) {
            localStorage.setItem('qmc_type', formType);
            localStorage.setItem('qmc_vars', varCount);
            localStorage.setItem('qmc_terms', terms);
            localStorage.setItem('qmc_dc', dc);
        }

        function parseTerms(inputStr) {
            if (!inputStr) return [];
            return inputStr
                .replace(/[^\d,\s]/g, '')
                .split(/[\s,]+/)
                .map(x => parseInt(x.trim()))
                .filter(x => !isNaN(x));
        }

        function toBinary(num, length) {
            return num.toString(2).padStart(length, '0');
        }

        function countOnes(str) {
            let count = 0;
            for (let char of str) {
                if (char === '1') count++;
            }
            return count;
        }

        function differByOne(s1, s2) {
            if (s1.length !== s2.length) return { isOne: false, index: -1 };
            let diffCount = 0;
            let diffIndex = -1;
            for (let i = 0; i < s1.length; i++) {
                if (s1[i] !== s2[i]) {
                    diffCount++;
                    diffIndex = i;
                }
            }
            return { isOne: diffCount === 1, index: diffIndex };
        }

        function binaryToExpression(binaryStr, type) {
            let varNames = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
            let resultParts = [];

            if (type === 'SOP') {
                for (let i = 0; i < binaryStr.length; i++) {
                    if (binaryStr[i] === '1') resultParts.push(varNames[i]);
                    else if (binaryStr[i] === '0') resultParts.push(varNames[i] + "'");
                }
                return resultParts.join('') || '1';
            } else { // POS
                for (let i = 0; i < binaryStr.length; i++) {
                    if (binaryStr[i] === '0') resultParts.push(varNames[i]);
                    else if (binaryStr[i] === '1') resultParts.push(varNames[i] + "'");
                }
                return resultParts.length > 0 ? '(' + resultParts.join(' + ') + ')' : '(0)';
            }
        }

        function copyExpression(exprText) {
            navigator.clipboard.writeText(exprText).then(() => {
                let btn = document.getElementById('copyBtn');
                btn.innerText = 'Copied Successfully! ✓';
                setTimeout(() => {
                    btn.innerText = 'Copy Expression';
                }, 2000);
            });
        }

        function evaluateExpressionForTerm(termVal, varCount, selectedPIs, formType) {
            let bin = toBinary(termVal, varCount);
            if (formType === 'SOP') {
                for (let pi of selectedPIs) {
                    let matches = true;
                    for (let i = 0; i < varCount; i++) {
                        if (pi.binary[i] !== '-' && pi.binary[i] !== bin[i]) {
                            matches = false;
                            break;
                        }
                    }
                    if (matches) return 1;
                }
                return 0;
            } else {
                for (let pi of selectedPIs) {
                    let matches = true;
                    for (let i = 0; i < varCount; i++) {
                        let expectedBinBit = pi.binary[i];
                        if (expectedBinBit !== '-') {
                            let varBit = bin[i];
                            if (expectedBinBit === '0' && varBit === '1') matches = false;
                            if (expectedBinBit === '1' && varBit === '0') matches = false;
                        }
                    }
                    if (matches) return 0;
                }
                return 1;
            }
        }

        function generateTruthTableVerification(varCount, primaryTerms, dontCares, selectedPIs, formType) {
            let maxTerms = Math.pow(2, varCount);
            let html = `<div class="table-step">`;
            html += `<h4>Truth Table Verification Matrix</h4>`;
            html += `<p style="font-size: 13px; opacity: 0.8; margin-top:0;">Comparing original specification against the optimized final expression across all possible input combinations.</p>`;
            
            html += `<div style="overflow-x:auto;"><table>`;
            html += `<tr>`;
            let varNames = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
            for(let i=0; i<varCount; i++) {
                html += `<th>${varNames[i]}</th>`;
            }
            html += `<th>Decimal</th><th>Original F</th><th>Optimized F</th><th>Status</th></tr>`;

            for(let m = 0; m < maxTerms; m++) {
                let bin = toBinary(m, varCount);
                let isPrimary = primaryTerms.includes(m);
                let isDC = dontCares.includes(m);
                
                let optVal = evaluateExpressionForTerm(m, varCount, selectedPIs, formType);

                let matches = true;
                if (formType === 'SOP') {
                    if (isPrimary && optVal !== 1) matches = false;
                    if (!isPrimary && !isDC && optVal !== 0) matches = false;
                } else {
                    if (isPrimary && optVal !== 0) matches = false;
                    if (!isPrimary && !isDC && optVal !== 1) matches = false;
                }

                html += `<tr>`;
                for(let i=0; i<varCount; i++) {
                    html += `<td>${bin[i]}</td>`;
                }
                html += `<td>${m}</td>`;
                html += `<td><strong>${isPrimary ? (formType==='SOP'?'1':'0') : (isDC?'X':'0/1')}</strong></td>`;
                html += `<td><strong>${optVal}</strong></td>`;
                html += `<td>${matches || isDC ? '<span class="verification-badge-match">Match ✓</span>' : '<span style="color:red; font-weight:bold;">Mismatch</span>'}</td>`;
                html += `</tr>`;
            }

            html += `</table></div></div>`;
            return html;
        }

        function generateKMap(varCount, primaryTerms, dontCares, selectedPIs, formType) {
            if (varCount < 2 || varCount > 5) return '<p>K-Map preview is supported for 2 to 5 variables.</p>';
            
            let grayCode2 = ['00', '01', '11', '10'];
            let grayCode1 = ['0', '1'];
            let rowGray, colGray, rowVars, colVars;

            if (varCount === 2) { 
                rowGray = grayCode1; colGray = grayCode1; rowVars = 'A'; colVars = 'B';
            } else if (varCount === 3) { 
                rowGray = grayCode1; colGray = grayCode2; rowVars = 'A'; colVars = 'BC';
            } else if (varCount === 4) { 
                rowGray = grayCode2; colGray = grayCode2; rowVars = 'AB'; colVars = 'CD';
            } else if (varCount === 5) { 
                rowGray = grayCode2; colGray = ['000', '001', '011', '010', '110', '111', '101', '100']; rowVars = 'AB'; colVars = 'CDE';
            }

            let html = `<div class="table-step">`;
            html += `<h4>K-Map Groups Breakdown (${rowVars} \\ ${colVars})</h4>`;
            html += `<p style="font-size: 13px; opacity: 0.8; margin-top:0;">The table below highlights individual cells, and the cards underneath show which terms were grouped together into Prime Implicants.</p>`;
            
            html += `<div style="overflow-x:auto;"><table>`;
            html += `<tr><th style="background:#34495e; color:#fff; text-align:center;">${rowVars} \\ ${colVars}</th>`;
            
            colGray.forEach(c => html += `<th style="background:#2c3e50; color:#fff;">${c}</th>`);
            html += `</tr>`;

            rowGray.forEach(r => {
                html += `<tr><th style="background:#2c3e50; color:#fff;">${r}</th>`;
                colGray.forEach(c => {
                    let binVal = r + c;
                    let decVal = parseInt(binVal, 2);
                    let cellContent = '0';
                    let cellClass = '';

                    if (primaryTerms.includes(decVal)) {
                        cellContent = formType === 'SOP' ? '1' : '0';
                        cellClass = 'kmap-cell-1';
                    } else if (dontCares.includes(decVal)) {
                        cellContent = 'X';
                        cellClass = 'kmap-cell-d';
                    }

                    html += `<td class="${cellClass}">${cellContent} <sub style="font-size:10px; opacity:0.6">[${decVal}]</sub></td>`;
                });
                html += `</tr>`;
            });

            html += `</table></div>`;
            html += `<div style="margin-top: 15px;"><strong>Detected Implicant Groups (Clusters):</strong>`;
            selectedPIs.forEach((pi, index) => {
                let expr = binaryToExpression(pi.binary, formType);
                html += `<div class="group-card">
                    <strong>Group ${index + 1}:</strong> Contains Minterms/Terms <code>[${pi.minterms.join(', ')}]</code> → Combined Term: <strong>${expr}</strong> (Binary: <code>${pi.binary}</code>)
                </div>`;
            });
            html += `</div></div>`;

            return html;
        }

        function renderGroupedTable(items, title) {
            let groups = {};
            items.forEach(item => {
                let ones = countOnes(item.binary);
                if (!groups[ones]) groups[ones] = [];
                groups[ones].push(item);
            });

            let sortedKeys = Object.keys(groups).map(Number).sort((a,b)=>a-b);

            let html = `<div class="table-step"><h4>${title}</h4>`;
            html += `<table><tr><th>Group</th><th>Terms</th><th>Binary Representation</th><th>Used</th></tr>`;

            let visualGroupIndex = 1;
            sortedKeys.forEach(k => {
                groups[k].forEach((item, idx) => {
                    let groupCell = (idx === 0) ? `<td rowspan="${groups[k].length}" style="font-weight:bold; background:rgba(0,0,0,0.03);">Group ${visualGroupIndex}</td>` : '';
                    html += `<tr>
                        ${groupCell}
                        <td>${item.minterms.join(',')}</td>
                        <td><code>${item.binary}</code></td>
                        <td>${item.used ? '✓' : ''}</td>
                    </tr>`;
                });
                visualGroupIndex++;
            });

            html += `</table></div>`;
            return html;
        }

        function startAdvancedSolver() {
            const formType = document.getElementById('type').value;
            const varCount = parseInt(document.getElementById('variables').value);
            const termsInput = document.getElementById('terms').value;
            const dontcaresInput = document.getElementById('dontcares').value;
            const outputDiv = document.getElementById('output');

            if (!termsInput || isNaN(varCount) || varCount < 1) {
                alert('Please enter valid variables and primary terms!');
                return;
            }

            saveInputsToStorage(formType, varCount, termsInput, dontcaresInput);

            let maxLimit = Math.pow(2, varCount) - 1;
            let primaryTerms = Array.from(new Set(parseTerms(termsInput))).sort((a,b)=>a-b);
            let dontCares = Array.from(new Set(parseTerms(dontcaresInput))).sort((a,b)=>a-b);
            let allTerms = Array.from(new Set([...primaryTerms, ...dontCares]));

            let outOfRange = allTerms.find(t => t < 0 || t > maxLimit);
            if (outOfRange !== undefined) {
                alert(`Error: Term ${outOfRange} is out of range! For ${varCount} variables, terms must be between 0 and ${maxLimit}.`);
                return;
            }

            let currentTable = allTerms.map(m => ({
                minterms: [m],
                binary: toBinary(m, varCount),
                used: false
            }));

            let htmlContent = `<h3>Step-by-Step Solution (${formType}):</h3>`;
            let primeImplicants = [];

            // الجدول الأول: Initially Formed Table
            htmlContent += renderGroupedTable(currentTable, "Initially Formed Table");

            let iterationCount = 1;

            while (true) {
                let nextTableMap = new Map();
                let groups = {};
                
                currentTable.forEach(item => {
                    let ones = countOnes(item.binary);
                    if (!groups[ones]) groups[ones] = [];
                    groups[ones].push(item);
                });

                let groupKeys = Object.keys(groups).map(Number).sort((a,b)=>a-b);

                for (let i = 0; i < groupKeys.length - 1; i++) {
                    let g1 = groups[groupKeys[i]];
                    let g2 = groups[groupKeys[i+1]];

                    g1.forEach(t1 => {
                        g2.forEach(t2 => {
                            let check = differByOne(t1.binary, t2.binary);
                            if (check.isOne) {
                                t1.used = true;
                                t2.used = true;
                                let newBinary = t1.binary.split('');
                                newBinary[check.index] = '-';
                                newBinary = newBinary.join('');
                                let combinedMinterms = Array.from(new Set([...t1.minterms, ...t2.minterms])).sort((a,b)=>a-b);
                                let key = combinedMinterms.join(',');

                                if (!nextTableMap.has(key)) {
                                    nextTableMap.set(key, { minterms: combinedMinterms, binary: newBinary, used: false });
                                }
                            }
                        });
                    });
                }

                currentTable.forEach(item => {
                    if (!item.used) {
                        if (!primeImplicants.some(pi => pi.binary === item.binary)) {
                            primeImplicants.push(item);
                        }
                    }
                });

                if (nextTableMap.size === 0) break;

                currentTable = Array.from(nextTableMap.values());
                
                // تسمية التكرارات: First Iteration, Second Iteration, Third Iteration ... إلخ
                let iterationTitle = (iterationCount === 1) ? "First Iteration" : (iterationCount === 2) ? "Second Iteration" : `${iterationCount}th Iteration`;
                
                htmlContent += renderGroupedTable(currentTable, iterationTitle);

                iterationCount++;
                if (iterationCount > 15) break;
            }

            let sortedPrimary = [...primaryTerms].sort((a,b)=>a-b);
            let selectedPIs = [];

            let uncovered = new Set(sortedPrimary);
            let piCoverage = primeImplicants.map(pi => ({
                pi: pi,
                covers: pi.minterms.filter(m => primaryTerms.includes(m))
            }));

            sortedPrimary.forEach(m => {
                let covering = piCoverage.filter(item => item.covers.includes(m));
                if (covering.length === 1) {
                    let pi = covering[0].pi;
                    if (!selectedPIs.includes(pi)) {
                        selectedPIs.push(pi);
                        pi.minterms.forEach(tm => uncovered.delete(tm));
                    }
                }
            });

            while (uncovered.size > 0) {
                let bestPI = null;
                let maxCovered = -1;

                piCoverage.forEach(item => {
                    if (!selectedPIs.includes(item.pi)) {
                        let count = item.covers.filter(m => uncovered.has(m)).length;
                        if (count > maxCovered) {
                            maxCovered = count;
                            bestPI = item.pi;
                        }
                    }
                });

                if (bestPI && maxCovered > 0) {
                    selectedPIs.push(bestPI);
                    bestPI.minterms.forEach(tm => uncovered.delete(tm));
                } else {
                    break;
                }
            }

            if (selectedPIs.length === 0) selectedPIs = primeImplicants;

            htmlContent += `<h3>Prime Implicant Chart:</h3>`;
            htmlContent += `<div class="table-step" style="overflow-x:auto;">`;
            htmlContent += `<table><tr><th>Prime Implicants</th><th>Expression</th>`;
            
            sortedPrimary.forEach(m => {
                htmlContent += `<th>${m}</th>`;
            });
            htmlContent += `</tr>`;

            primeImplicants.forEach((pi) => {
                let expr = binaryToExpression(pi.binary, formType);
                let isSelected = selectedPIs.includes(pi);
                let rowStyle = isSelected ? 'background-color: var(--selected-bg); font-weight: bold;' : '';
                
                htmlContent += `<tr style="${rowStyle}"><td>${pi.minterms.join(',')} ${isSelected ? '★' : ''}</td><td><strong>${expr}</strong></td>`;
                
                sortedPrimary.forEach(m => {
                    let covers = pi.minterms.includes(m);
                    htmlContent += `<td>${covers ? '<span class="mark-x">X</span>' : ''}</td>`;
                });
                htmlContent += `</tr>`;
            });

            htmlContent += `</table></div>`;

            if (varCount >= 2 && varCount <= 5) {
                htmlContent += generateKMap(varCount, primaryTerms, dontCares, selectedPIs, formType);
            }

            htmlContent += generateTruthTableVerification(varCount, primaryTerms, dontCares, selectedPIs, formType);

            let finalExpressionParts = selectedPIs.map(pi => binaryToExpression(pi.binary, formType));
            let finalConnector = (formType === 'SOP') ? ' + ' : ' . ';
            let fullExpressionString = `F = ${finalExpressionParts.join(finalConnector)}`;
            
            htmlContent += `<div class="final-result">
                <h3 style="margin-top:0; color: #27ae60;">Optimized Final Expression (${formType}):</h3>
                <p style="font-size: 18px; font-family: monospace;" id="exprText">${fullExpressionString}</p>
                <button class="btn-copy" id="copyBtn" onclick="copyExpression('${fullExpressionString}')">Copy Expression</button>
            </div>`;

            outputDiv.innerHTML = htmlContent;
        }
    </script>

</body>
</html>
